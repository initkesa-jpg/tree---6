<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дерево артефактов: итоговый проект</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e2027;--bg-s:#282a31;--bg-e:#32343c;--bg-h:#3a3c45;--text:#fff;--t2:rgba(255,255,255,.6);--t3:rgba(255,255,255,.32);--acc:#ff5533;--ok:#22c55e;--radius:10px;--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
button{font-family:var(--font);cursor:pointer}
a{color:var(--acc);text-decoration:none}

/* ===== HEADER ===== */
.hdr{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--bg-s);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;z-index:20;position:relative}
.hdr-title{font-size:15px;font-weight:700}
.hdr-tag{font-size:10px;color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.prog{display:flex;align-items:center;gap:8px}
.prog-bar{width:100px;height:5px;background:var(--bg-e);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--acc);border-radius:3px;transition:width .4s}
.prog-lbl{font-size:11px;color:var(--t2);font-weight:600;min-width:28px;text-align:right}
.btn-s{background:var(--bg-e);color:var(--t2);border:none;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;transition:all .15s}
.btn-s:hover{background:var(--bg-h);color:var(--text)}
.btn-fit{background:var(--bg-e);color:var(--t2);border:none;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.btn-fit:hover{background:var(--bg-h);color:var(--text)}
@media(max-width:700px){
  .hdr{padding:8px 14px;gap:8px}
  .hdr-title{font-size:13px}
  .prog-bar{display:none}
  .btn-fit{display:none}
}

/* ===== VIEWPORT ===== */
.vp{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.vp:active{cursor:grabbing}
.vp-bg{position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.02) 1px,transparent 0) 0 0/28px 28px}
.canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}

/* ===== EDGES (SVG) ===== */
.edge-svg{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.edge-path{fill:none;stroke:rgba(255,255,255,.12);stroke-width:1.5}
.edge-path.carry{stroke-dasharray:6 4;stroke:rgba(255,255,255,.08)}
.edge-path.active{stroke:var(--acc);stroke-width:2}
.edge-lbl{font-family:var(--font);font-size:9px;fill:var(--t3);pointer-events:none}
.edge-lbl-bg{fill:var(--bg);opacity:.85}

/* ===== NODES ===== */
.nd{position:absolute;width:200px;background:var(--bg-s);border:1.5px solid rgba(255,255,255,.08);border-radius:var(--radius);cursor:pointer;user-select:none;transition:border-color .2s,box-shadow .2s}
.nd:hover{border-color:rgba(255,255,255,.18);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.nd.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,85,51,.15)}
.nd.done{border-color:rgba(34,197,94,.3)}
.nd.done .nd-bar{background:var(--ok)}
.nd.reuse{border-style:dashed;border-color:rgba(255,255,255,.14);background:rgba(40,42,49,.7)}
.nd-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--radius) 0 0 var(--radius)}
.nd-body{padding:12px 14px 10px 18px;min-height:72px;display:flex;flex-direction:column;gap:2px}
.nd-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.5}
.nd-title{font-size:13px;font-weight:700;line-height:1.3}
.nd-desc{font-size:10px;color:var(--t2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nd-foot{display:flex;align-items:center;gap:4px;margin-top:4px}
.nd-badge{font-size:9px;font-weight:600;padding:2px 6px;border-radius:8px;background:rgba(255,255,255,.05);color:var(--t3)}
.nd-badge.prompt{background:rgba(255,85,51,.08);color:var(--acc)}
.nd-badge.reuse{background:rgba(59,130,246,.1);color:#7fb0f5}
.nd-check{margin-left:auto;width:18px;height:18px;border-radius:5px;border:1.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;cursor:pointer}
.nd-check:hover{border-color:var(--acc);background:rgba(255,85,51,.1)}
.nd.done .nd-check{background:var(--ok);border-color:var(--ok)}
.nd.done .nd-check:hover{background:#16a34a;border-color:#16a34a}

/* ===== DETAIL PANEL ===== */
.panel{position:fixed;top:0;right:0;width:400px;height:100%;background:var(--bg-s);border-left:1px solid rgba(255,255,255,.06);z-index:30;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column}
#panContent{display:flex;flex-direction:column;flex:1;min-height:0;height:100%}
.panel.open{transform:translateX(0)}
@media(max-width:700px){.panel{width:100%;top:auto;bottom:0;height:80vh;border-left:none;border-top:1px solid rgba(255,255,255,.08);border-radius:16px 16px 0 0;transform:translateY(100%)}
.panel.open{transform:translateY(0)}}
.pan-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.pan-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pan-info{flex:1;min-width:0}
.pan-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pan-title{font-size:16px;font-weight:700}
.pan-close{background:none;border:none;color:var(--t3);padding:4px;display:flex;transition:color .15s}
.pan-close:hover{color:var(--text)}
.pan-scroll{flex:1;min-height:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;padding:16px 20px 80px;scrollbar-width:thin;scrollbar-color:var(--bg-e) transparent}

.pan-desc{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:16px}
.pan-banner{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;font-size:11px;color:var(--t2);line-height:1.5;margin-bottom:16px}
.pan-banner svg{flex-shrink:0;margin-top:1px;color:var(--t3)}
.pan-banner.reuse{border-color:rgba(59,130,246,.25);background:rgba(59,130,246,.05)}

/* IO sections */
.io{margin-bottom:16px}
.io-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:6px}
.io-item{padding:5px 8px;margin-bottom:3px;background:var(--bg-e);border-radius:5px;font-size:11px;color:var(--t2);line-height:1.5}
.io-item.in{border-left:2px solid rgba(59,130,246,.4)}
.io-item.out{border-left:2px solid rgba(34,197,94,.4)}

/* Prompt / examples */
.plink{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,85,51,.06);border:1px solid rgba(255,85,51,.12);border-radius:8px;margin-bottom:12px;text-decoration:none !important;transition:background .15s;width:100%;text-align:left}
.plink:hover{background:rgba(255,85,51,.1)}
.plink-info{flex:1}
.plink-label{font-size:12px;font-weight:600;color:var(--acc)}
.plink-hint{font-size:10px;color:var(--t3);margin-top:1px}
.plink.ex{background:rgba(78,205,196,.05);border-color:rgba(78,205,196,.15)}
.plink.ex:hover{background:rgba(78,205,196,.09)}
.plink.ex .plink-label{color:#4ecdc4}
.pprev{margin-bottom:16px;padding:10px 12px;background:#252830;border:1px solid rgba(255,255,255,.06);border-radius:8px;font-family:'SF Mono','Fira Code',monospace;font-size:10px;line-height:1.7;color:rgba(255,255,255,.6);white-space:pre-wrap;max-height:320px;overflow-y:auto;scrollbar-width:thin}
.pprev-cap{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:4px}
.pprev .kw{color:var(--acc);font-weight:600}
.pprev .var{color:#4ecdc4}
.pprev .dim{color:rgba(255,255,255,.3)}

/* Complete button */
.pan-complete{display:flex;align-items:center;gap:10px;padding:12px 16px;margin-top:16px;background:var(--bg-e);border-radius:8px;cursor:pointer;user-select:none;transition:background .15s}
.pan-complete:hover{background:var(--bg-h)}
.pc-box{width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.pc-box.on{background:var(--ok);border-color:var(--ok)}
.pc-box svg{opacity:0;transition:opacity .15s}
.pc-box.on svg{opacity:1}
.pc-text{font-size:12px;color:var(--t2)}
.pc-text strong{color:var(--text)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a2e38;color:var(--text);padding:10px 22px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
</style>
</head>
<body>
<header class="hdr">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff5533" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6m0 0l-6 4m6-4l6 4M6 13v5m12-5v5"/><circle cx="12" cy="3" r="1.5"/><circle cx="6" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
  <span class="hdr-title">Дерево артефактов</span>
  <span class="hdr-tag" style="white-space:nowrap">Итоговый&nbsp;проект</span>
  <div class="hdr-right">
    <div class="prog"><div class="prog-bar"><div class="prog-fill" id="pf"></div></div><span class="prog-lbl" id="pl">0/10</span></div>
    <button class="btn-fit" id="btnFit" title="Вписать в экран"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    <button class="btn-s" id="btnReset">Сбросить</button>
  </div>
</header>

<div class="vp" id="vp">
  <div class="vp-bg"></div>
  <div class="canvas" id="canvas">
    <svg class="edge-svg" id="edgeSvg" width="950" height="1120">
</svg>
    <div id="nodes"></div>
  </div>
</div>

<div class="panel" id="panel"><div id="panContent"></div></div>
<div class="toast" id="toast">Промпт скопирован в буфер</div>

<script>
/* ================ SCORM ================ */
const SCORM={api:null,init(){this.api=this._find(window);if(this.api)try{this.api.LMSInitialize('')}catch(e){}},done(s){if(!this.api)return;try{this.api.LMSSetValue('cmi.core.lesson_status',s);this.api.LMSCommit('')}catch(e){}},score(v){if(!this.api)return;try{this.api.LMSSetValue('cmi.core.score.raw',String(v));this.api.LMSSetValue('cmi.core.score.min','0');this.api.LMSSetValue('cmi.core.score.max','100');this.api.LMSCommit('')}catch(e){}},finish(){if(this.api)try{this.api.LMSFinish('')}catch(e){}},_find(w){let n=0;while(!w.API&&w.parent!==w&&n++<10)w=w.parent;return w.API||null}};
try{SCORM.init()}catch(e){}
window.addEventListener('beforeunload',()=>SCORM.finish());

/* ================ ICONS ================ */
const IC={
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',
  close:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  copy:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  arrow:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  info:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg>',
  archive:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><line x1="10" y1="12" x2="14" y2="12"/></svg>',
};
const NODE_ICONS={
  archive:IC.archive.replace('width="14" height="14"','width="18" height="18"'),
  file:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>',
  palette:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="8" cy="10" r="1.2" fill="currentColor"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor"/><circle cx="16" cy="10" r="1.2" fill="currentColor"/><path d="M12 22a10 10 0 0 0 0-20"/><path d="M12 16a2.5 2.5 0 0 1 0 5"/></svg>',
  screens:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="13" height="16" rx="2"/><rect x="17" y="7" width="5" height="10" rx="1.5"/><line x1="6" y1="9" x2="11" y2="9"/><line x1="6" y1="13" x2="11" y2="13"/></svg>',
  rocket:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>',
  deck:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="13" rx="2"/><line x1="12" y1="16" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="7" y1="8" x2="13" y2="8"/><line x1="7" y1="11" x2="11" y2="11"/></svg>',
  play:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>',
  metric:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  money:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  canvasIc:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>',
};

/* ================ PROMPTS (полные, копируются кнопкой) ================ */
const PROMPTS={
brief:`БРИФ ПРОДУКТА

Продукт: [из Product Vision: категория + ключевая выгода, одно предложение]
Сегмент: [из Product Vision «Для…»]
Потребность/боль: [из Product Vision «которые испытывают…»]
Отличие: [из Product Vision «в отличие от… / наше отличие…»]
Ключевой сценарий: [шаги пользователя от входа до получения ценности — ЕДИНСТВЕННОЕ
  новое поле; один сценарий, самый важный]
Метрика успеха: [показатель + целевое значение — из Lean Canvas «Ключевые метрики»]
Характер бренда: [2–3 слова: строгий / дружелюбный / технологичный / дерзкий…]`,

ds:`Роль: ведущий продуктовый дизайнер. Собери дизайн-систему продукта одним
самодостаточным файлом design_system.html.

ВХОД — бриф продукта (ниже вставлен целиком):
[ВСТАВЬТЕ СЮДА ВЕСЬ brief.md ИЗ ШАГА 0]

═══ 1. КОНСТАНТЫ (СSS-переменные в :root) ═══
- Палитра: тёмный и светлый фон, ОДИН главный акцент + 1-2 вспомогательных,
  семантические цвета статусов (успех/внимание/ошибка), два уровня текста
  (основной и приглушённый) + слабый третий для подписей.
- Радиусы (2-3 ступени), базовый отступ и шкала отступов, тень карточки.
- Правило: меняем переменную — меняется вся система. Ни одного цвета
  или радиуса «зашитого» в компонент напрямую.

═══ 2. ТИПОГРАФИКА ═══
- Пара шрифтов Google Fonts: выразительный ДИСПЛЕЙНЫЙ для цифр и заголовков
  (характер бренда из брифа!) + спокойный текстовый для абзацев и подписей.
- Покажи шкалу размеров (h1/h2/body/caption) живыми образцами.
- «ЦИФРЫ-ГЕРОИ»: крупные живые образцы ключевых метрик продукта
  (из брифа) дисплейным шрифтом — они задают характер всей системы.
- Для капс-подписей — letter-spacing; покажи образец.

═══ 3. КОМПОНЕНТЫ (каждый — живым примером с данными продукта) ═══
- Кнопки: основная, второстепенная, призрачная + состояния hover.
- Карточка метрики: значение цифрой-героем + подпись + мини-тренд.
- Поля формы, таблица, статусные бейджи, прогресс (полоса и/или кольцо).
- Свотчи палитры: цвет + HEX + имя CSS-переменной.
- Иконки: единый стиль (контурные, один stroke) — и правило:
  НИКАКИХ эмодзи в интерфейсе и слайдах (разнобой стилей, «тофу» при экспорте).

═══ 4. ФОТО-СТИЛЬ И ГЕНЕРАЦИЯ ИЗОБРАЖЕНИЙ (отдельная секция страницы) ═══
Это инструкция, по которой будут генерироваться ВСЕ растровые изображения
продукта (hero посадочной, слайды презентации, key visuals):
- Настроение, свет и фон кадра; где в кадре живут фирменные цвета
  (одежда, предметы, подсветка, окружение).
- Персонажи: один сквозной герой (кто он — из сегмента брифа) +

/* ================ STATE ================ */
const SK='dddm_m6_artifact_tree_v3';
let visited=new Set(), selected=null;
function load(){try{const d=JSON.parse(localStorage.getItem(SK));if(d)visited=new Set(d.v||[])}catch(e){}}

/* ================ CANVAS ENGINE ================ */
let tx=0,ty=0,sc=1;
let dragging=false,dragX=0,dragY=0;
const vp=document.getElementById('vp');
const cvs=document.getElementById('canvas');

function applyTransform(){cvs.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`}

vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('.nd')||e.target.closest('.panel'))return;
  dragging=true;dragX=e.clientX-tx;dragY=e.clientY-ty;
});
vp.addEventListener('pointermove',e=>{
  if(!dragging)return;
  tx=e.clientX-dragX;ty=e.clientY-dragY;applyTransform();
});
vp.addEventListener('pointerup',()=>{dragging=false});

vp.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=vp.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const d=e.ctrlKey?-e.deltaY*0.01:-e.deltaY*0.002;
  const ns=Math.min(3,Math.max(0.2,sc*(1+d)));
  const r=ns/sc;
  tx=mx-(mx-tx)*r; ty=my-(my-ty)*r; sc=ns;
  applyTransform();
},{passive:false});

let touches=[];
vp.addEventListener('touchstart',e=>{if(e.target.closest('.panel'))return;touches=[...e.touches]},{passive:true});
vp.addEventListener('touchmove',e=>{
  if(e.target.closest('.panel'))return;
  if(e.touches.length===2){
    e.preventDefault();
    const t=e.touches;
    const d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    const mx=(t[0].clientX+t[1].clientX)/2, my=(t[0].clientY+t[1].clientY)/2;
    if(touches.length===2){
      const pd=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
      const r=d/pd;
      const ns=Math.min(3,Math.max(0.2,sc*r));
      const ratio=ns/sc;
      const rect=vp.getBoundingClientRect();
      const cx=mx-rect.left, cy=my-rect.top;
      tx=cx-(cx-tx)*ratio; ty=cy-(cy-ty)*ratio; sc=ns;
    }
    applyTransform();
  }
  touches=[...e.touches];
},{passive:false});

function fitToView(){
  const rect=vp.getBoundingClientRect();
  const pad=40;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  NODES.forEach(n=>{minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);maxX=Math.max(maxX,n.x+W);maxY=Math.max(maxY,n.y+H)});
  const cw=maxX-minX+pad*2, ch=maxY-minY+pad*2;
  sc=Math.min(rect.width/cw, rect.height/ch, 1.2);
  tx=(rect.width-cw*sc)/2 - minX*sc + pad*sc;
  ty=(rect.height-ch*sc)/2 - minY*sc + pad*sc;
  applyTransform();
}
document.getElementById('btnFit').onclick=fitToView;

/* ================ RENDER EDGES ================ */
function portPos(nd,side){
  if(side==='bottom')return{x:nd.x+W/2,y:nd.y+H};
  if(side==='top')return{x:nd.x+W/2,y:nd.y};
  if(side==='right')return{x:nd.x+W,y:nd.y+H/2};
  return{x:nd.x,y:nd.y+H/2};
}
function nodeById(id){return NODES.find(n=>n.id===id)}

function renderEdges(){
  const svg=document.getElementById('edgeSvg');
  let html='';
  EDGES.forEach(e=>{
    const fn=nodeById(e.from), tn=nodeById(e.to);
    let p1,p2,c1,c2;
    const gap=2;
    if(e.cross){
      p1=portPos(fn,'right'); p2=portPos(tn,'left');
      p2={x:p2.x+gap,y:p2.y};
      const dx=p2.x-p1.x;
      c1={x:p1.x+dx*0.4,y:p1.y}; c2={x:p2.x-dx*0.4,y:p2.y};
    } else if(e.carry){
      p1=portPos(fn,'bottom'); p2=portPos(tn,'top');
      p2={x:p2.x,y:p2.y-gap};
      const offX=fn.x<tn.x?-50:50;
      c1={x:p1.x+offX,y:p1.y+(p2.y-p1.y)*0.3};
      c2={x:p2.x+offX,y:p2.y-(p2.y-p1.y)*0.3};
    } else {
      p1=portPos(fn,'bottom'); p2=portPos(tn,'top');
      p2={x:p2.x,y:p2.y-gap};
      const dy=p2.y-p1.y;
      c1={x:p1.x,y:p1.y+dy*0.4}; c2={x:p2.x,y:p2.y-dy*0.4};
    }
    const isActive=selected===e.from||selected===e.to;
    const cls=e.carry?'edge-path carry':'edge-path';
    html+=`<path class="${cls}${isActive?' active':''}" d="M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}"/>`;
    const t=0.95,t1=1-t;
    const tx2=3*t1*t1*(c1.x-p1.x)+6*t1*t*(c2.x-c1.x)+3*t*t*(p2.x-c2.x);
    const ty2=3*t1*t1*(c1.y-p1.y)+6*t1*t*(c2.y-c1.y)+3*t*t*(p2.y-c2.y);
    const len=Math.sqrt(tx2*tx2+ty2*ty2)||1;
    const ux=tx2/len,uy=ty2/len;
    const px=-uy,py=ux;
    const sz=7;
    const ax=p2.x-ux*sz+px*sz*0.5, ay=p2.y-uy*sz+py*sz*0.5;
    const bx=p2.x-ux*sz-px*sz*0.5, by=p2.y-uy*sz-py*sz*0.5;
    const aFill=isActive?'#ff5533':e.carry?'rgba(255,255,255,.2)':'rgba(255,255,255,.35)';
    html+=`<polygon points="${p2.x},${p2.y} ${ax},${ay} ${bx},${by}" fill="${aFill}"/>`;
    const mx=.125*p1.x+.375*c1.x+.375*c2.x+.125*p2.x;
    const my=.125*p1.y+.375*c1.y+.375*c2.y+.125*p2.y;
    const tw=e.label.length*5+8, th=14;
    html+=`<rect class="edge-lbl-bg" x="${mx-tw/2}" y="${my-th/2}" width="${tw}" height="${th}" rx="3"/>`;
    html+=`<text class="edge-lbl" x="${mx}" y="${my+3}" text-anchor="middle">${esc(e.label)}</text>`;
  });
  svg.innerHTML=html;
}

/* ================ RENDER NODES ================ */
function renderNodes(){
  const container=document.getElementById('nodes');
  container.innerHTML='';
  NODES.forEach(nd=>{
    const done=visited.has(nd.id);
    const sel=selected===nd.id;
    const el=document.createElement('div');
    el.className='nd'+(done?' done':'')+(sel?' sel':'')+(nd.reuse?' reuse':'');
    el.style.cssText=`left:${nd.x}px;top:${nd.y}px;width:${W}px`;
    el.dataset.id=nd.id;
    el.innerHTML=`
      <div class="nd-bar" style="background:${nd.color}"></div>
      <div class="nd-body">
        <div class="nd-tag" style="color:${nd.color}">${nd.tag}</div>
        <div class="nd-title">${nd.title}</div>
        <div class="nd-desc">${nd.desc}</div>
        <div class="nd-foot">
          ${nd.badges.map(b=>`<span class="nd-badge${b.t?' '+b.t:''}">${b.l}</span>`).join('')}
          <div class="nd-check">${done?IC.check:''}</div>
        </div>
      </div>`;
    container.appendChild(el);
  });
}

/* ================ DETAIL PANEL ================ */
function openPanel(id){
  selected=id;
  const nd=nodeById(id);
  const panel=document.getElementById('panel');
  const ct=document.getElementById('panContent');
  const done=visited.has(id);
  let h=`<div class="pan-head">
    <div class="pan-icon" style="background:${nd.color}15;color:${nd.color}">${NODE_ICONS[nd.icon]||''}</div>
    <div class="pan-info"><div class="pan-tag" style="color:${nd.color}">${nd.tag}</div><div class="pan-title">${nd.title}</div></div>
    <button class="pan-close" data-action="close">${IC.close}</button>
  </div><div class="pan-scroll">`;
  h+=`<div class="pan-desc">${nd.desc}</div>`;
  if(nd.banner)h+=`<div class="pan-banner${nd.reuse?' reuse':''}">${IC.info}<span>${nd.banner}</span></div>`;
  if(nd.inputs?.length)h+=`<div class="io"><div class="io-h">${nd.reuse?'Где взять':'Входные артефакты'}</div>${nd.inputs.map(i=>`<div class="io-item in">${esc(i)}</div>`).join('')}</div>`;
  if(nd.outputs?.length)h+=`<div class="io"><div class="io-h">${nd.reuse?'Что берём дальше':'Выходные артефакты'}</div>${nd.outputs.map(o=>`<div class="io-item out">${esc(o)}</div>`).join('')}</div>`;
  if(nd.promptKey){
    h+=`<button class="plink" data-action="copy-prompt" data-key="${nd.promptKey}"><span style="color:var(--acc)">${IC.copy}</span><div class="plink-info"><div class="plink-label">Скопировать промпт целиком</div><div class="plink-hint">вставьте агенту вместе с файлами из «входных артефактов»</div></div><span style="color:var(--acc)">${IC.arrow}</span></button>`;
    if(PROMPT_DOCS[nd.promptKey])h+=`<a class="plink" href="${GL}/m6/artifact_prompts/${PROMPT_DOCS[nd.promptKey]}" target="_blank" rel="noopener"><span style="color:var(--acc)">${IC.arrow}</span><div class="plink-info"><div class="plink-label">Читать промпт в GitLab</div><div class="plink-hint">${PROMPT_DOCS[nd.promptKey]} — документ с пояснениями и чек-листом приёмки</div></div></a>`;
    h+=`<div class="pprev-cap">Полный текст промпта (прокручивается)</div><div class="pprev">${esc(PROMPTS[nd.promptKey])}</div>`;
  }
  (nd.examples||[]).forEach(ex=>{
    h+=`<a class="plink ex" href="${ex.url}" target="_blank" rel="noopener"><span style="color:#4ecdc4">${IC.arrow}</span><div class="plink-info"><div class="plink-label">${ex.label}</div><div class="plink-hint">${ex.hint||''}</div></div></a>`;
  });
  const pcText=nd.reuse?'<strong>Артефакт найден</strong> — файл под рукой':'<strong>Этап пройден</strong> — артефакт собран и проверен';
  h+=`<div class="pan-complete" data-action="toggle-done" data-id="${id}"><div class="pc-box${done?' on':''}">${IC.check}</div><div class="pc-text">${pcText}</div></div>`;
  h+=`</div>`;
  ct.innerHTML=h;
  panel.classList.add('open');
  renderNodes();renderEdges();
}

function closePanel(){
  selected=null;
  document.getElementById('panel').classList.remove('open');
  renderNodes();renderEdges();
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),1500);
}

function updateProgress(){
  const n=NODES.length,d=visited.size,p=Math.round(d/n*100);
  document.getElementById('pf').style.width=p+'%';
  document.getElementById('pl').textContent=d+'/'+n;
  if(d===n){SCORM.done('completed');SCORM.score(100)}
  else if(d>0){SCORM.done('incomplete');SCORM.score(p)}
}

/* ================ EVENTS ================ */
document.getElementById('nodes').addEventListener('click',e=>{
  const chk=e.target.closest('.nd-check');
  if(chk){
    e.stopPropagation();
    const id=chk.closest('.nd').dataset.id;
    if(visited.has(id))visited.delete(id);else visited.add(id);
    save();renderNodes();renderEdges();updateProgress();
    if(selected===id)openPanel(id);
    return;
  }
  const nd=e.target.closest('.nd');
  if(nd){e.stopPropagation();openPanel(nd.dataset.id)}
});
document.getElementById('panel').addEventListener('click',e=>{
  const act=e.target.closest('[data-action]');
  if(!act)return;
  const a=act.dataset.action;
  if(a==='close'){closePanel();return}
  if(a==='toggle-done'){
    const id=act.dataset.id;
    if(visited.has(id))visited.delete(id);else visited.add(id);
    save();openPanel(id);updateProgress();return;
  }
  if(a==='copy-prompt'){
    const txt=PROMPTS[act.dataset.key]||'';
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>toast('Промпт скопирован в буфер'),()=>fallbackCopy(txt));
    } else fallbackCopy(txt);
    return;
  }
});
function fallbackCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt;ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Промпт скопирован в буфер')}catch(e){toast('Не удалось скопировать')}
  ta.remove();
}
vp.addEventListener('click',e=>{
  if(!e.target.closest('.nd')&&!e.target.closest('.panel')&&selected){closePanel()}
});
document.getElementById('btnReset').onclick=()=>{visited.clear();save();selected=null;closePanel();renderNodes();updateProgress()};

/* ================ INIT ================ */
renderNodes();renderEdges();updateProgress();
let userMoved=false;
vp.addEventListener('pointerdown',()=>{userMoved=true});
vp.addEventListener('wheel',()=>{userMoved=true},{passive:true});
document.getElementById('btnFit').addEventListener('click',()=>{userMoved=false});
function safeFit(){const r=vp.getBoundingClientRect();if(r.width<50||r.height<50)return;fitToView()}
requestAnimationFrame(safeFit);
window.addEventListener('load',safeFit);
if(window.ResizeObserver){new ResizeObserver(()=>{if(!userMoved)safeFit()}).observe(vp)}
else{window.addEventListener('resize',()=>{if(!userMoved)safeFit()})}
</script>
